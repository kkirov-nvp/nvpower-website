  <g>
    <g transform="translate(820 690)">
      <rect x="0" y="0" width="200" height="66" rx="5" transform="skewX(-18)" fill="#0e3d44" stroke="#2b96a1" stroke-width="2.5"/>
      <line x1="46" y1="0" x2="24" y2="66" stroke="#2b96a1" stroke-width="1.5"/>
