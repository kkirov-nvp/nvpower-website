<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#01323a"/>
      <stop offset="0.55" stop-color="#00505c"/>
      <stop offset="1" stop-color="#007b88"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2a2e"/>
      <stop offset="1" stop-color="#081d20"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun low on the horizon -->
  <circle cx="1180" cy="565" r="150" fill="url(#glow)"/>
  <circle cx="1180" cy="565" r="62" fill="#ffe3a3" opacity="0.95"/>

  <!-- distant hills -->
  <path d="M0 640 Q 300 585 640 630 T 1600 615 V 900 H 0 Z" fill="#0a3238" opacity="0.85"/>

  <!-- ground -->
  <path d="M0 690 Q 400 655 800 680 T 1600 672 V 900 H 0 Z" fill="url(#ground)"/>

  <!-- wind turbines -->
  <g stroke="#dfeeee" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <line x1="330" y1="640" x2="330" y2="430"/>
    <g>
      <line x1="330" y1="430" x2="330" y2="310"/>
      <line x1="330" y1="430" x2="434" y2="490"/>
      <line x1="330" y1="430" x2="226" y2="490"/>
    </g>
  </g>
  <circle cx="330" cy="430" r="10" fill="#dfeeee"/>
  <g stroke="#cfe3e3" stroke-width="5" stroke-linecap="round" opacity="0.7">
    <line x1="560" y1="655" x2="560" y2="505"/>
    <line x1="560" y1="505" x2="560" y2="420"/>
    <line x1="560" y1="505" x2="634" y2="548"/>
    <line x1="560" y1="505" x2="486" y2="548"/>
  </g>
  <circle cx="560" cy="505" r="7" fill="#cfe3e3" opacity="0.8"/>
  <g stroke="#bcd6d6" stroke-width="4" stroke-linecap="round" opacity="0.5">
    <line x1="120" y1="660" x2="120" y2="540"/>
    <line x1="120" y1="540" x2="120" y2="472"/>
    <line x1="120" y1="540" x2="179" y2="574"/>
    <line x1="120" y1="540" x2="61" y2="574"/>
  </g>

